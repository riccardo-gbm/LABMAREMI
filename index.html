<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="LABMAREMI — Distribuidor de productos de limpieza, desinfección, protección e higiene para empresas en Quito, Ecuador." />
  <title>LABMAREMI — Suministros de limpieza e higiene para empresas</title>
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="40x40" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <meta name="theme-color" content="#1d4ed8" />
  <!-- Social sharing. Add og:url, og:image (absolute URLs) and a canonical
         link once the site has a deployed domain. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="LABMAREMI" />
  <meta property="og:locale" content="es_EC" />
  <meta property="og:title" content="LABMAREMI — Suministros de limpieza e higiene para empresas" />
  <meta property="og:description"
    content="Distribuidor de productos de limpieza, desinfección, protección e higiene para empresas en Quito, Ecuador." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="LABMAREMI — Suministros de limpieza e higiene para empresas" />
  <meta name="twitter:description"
    content="Distribuidor de productos de limpieza, desinfección, protección e higiene para empresas en Quito, Ecuador." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Every hero/tile photo comes from Unsplash and all catalog data + product
       images from Supabase; warming both connections during HTML parse saves a
       DNS+TLS round trip on mobile. crossorigin on Supabase: fetch() is CORS;
       none on Unsplash: <img> is no-CORS. -->
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="preconnect" href="https://alyjdwsblnedadlfplgw.supabase.co" crossorigin />
  <!-- The four fetchPriority="high" hero clouds otherwise wait for entry JS +
       the lazy HeroFloatingCanvas chunk before the browser even learns their
       URLs. Preload starts them at t≈0; default (low) priority so they never
       preempt the critical JS. -->
  <link rel="preload" as="image" href="/photo1.webp" />
  <link rel="preload" as="image" href="/photo2.webp" />
  <link rel="preload" as="image" href="/photo3.webp" />
  <link rel="preload" as="image" href="/photo4.webp" />
  <!-- Fonts load without blocking first paint: the media="print" swap applies
       the sheet on load instead of holding render on a third-party round trip
       (HTML → googleapis CSS → gstatic files). display=swap already paints the
       fallback, so the h1 — the LCP element — no longer waits on the network.
       The italic axis was dropped: nothing in src/ uses italic, and carrying
       1,400..900 roughly doubled the Playfair payload.

       CSP COUPLING: the onload handler below is inline script, which
       `script-src 'self'` blocks. vercel.json allows exactly this one handler
       via 'unsafe-hashes' plus the SHA-256 of its source text — so editing the
       attribute (even a quote style or a space) invalidates the hash and the
       swap silently stops firing, leaving the sheet stuck at media="print" and
       the site on fallback fonts. Change one, change the other. -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400..900&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400..900&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400..900&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  </noscript>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
